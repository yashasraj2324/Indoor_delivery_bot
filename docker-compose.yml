services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-mysql+aiomysql://root:root@db:3306/robot_db}
      REDIS_URL: redis://redis:6379/0
      ROBOT_COMMAND_CHANNEL_ENABLED: ${ROBOT_COMMAND_CHANNEL_ENABLED:-true}
      ROBOT_COMMAND_TTL_S: ${ROBOT_COMMAND_TTL_S:-15}
      ROBOT_COMMAND_ACK_TIMEOUT_S: ${ROBOT_COMMAND_ACK_TIMEOUT_S:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: robot_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
